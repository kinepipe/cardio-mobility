name: Build Cardio Mobility Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build

      - name: Add Android platform if missing & sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CardioMobility.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardioMobility-Android-APK
          path: app/android/app/build/outputs/apk/debug/CardioMobility.apk

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Cardio Mobility v1.0.0 (Android APK)"
          body: |
            ## Cardio Mobility — Movilidad Cardiovascular Segura (Android APK)

            Aplicación 100% offline (sin servidores) con **30 ejercicios basados en evidencia**, **visor anatómico 3D interactivo estilo OpenSim**, chequeo previo de banderas rojas, guía por voz en español anti-Valsalva y recordatorios nativos.

            ### Instalación en Android
            1. Descarga **`CardioMobility.apk`** desde los *Assets* de abajo.
            2. Ábrelo en tu teléfono Android y permite instalar apps desde tu navegador/archivos si te lo solicita.
          files: app/android/app/build/outputs/apk/debug/CardioMobility.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
